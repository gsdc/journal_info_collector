# /build-report 재확인에서 자동 판정을 고친 논문. 키는 DOI(대소문자 무시).
# 결과(CSV·엑셀)의 Ack 값을 바꾸고 '비고'에 사유를 붙인다.
# candidates.json은 fetch마다 다시 만들어지므로 고친 판정은 여기에 남긴다.
#
# ack: "Y" | "N" | "미확인"
# reason: 고친 근거(사사 원문에서 정규식이 놓친 표기 등)
#
# 예)
#   "10.1103/physrevd.xxx.xxxxxx":
#     ack: "Y"
#     reason: "사사에 'K.I.S.T.I.' 표기(정규식 미검출)"
ack_overrides: {}
